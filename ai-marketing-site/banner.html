<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>באנר שיווק בעידן ה-AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@600;800&display=swap">
<style>
/* Banner 1920x640: title on the right, department + logo on the left, term strip along the bottom. */
:root{
  --bg:#F2F3FA; --ink:#0D0E2B; --muted:#5A5D7D; --line:#D7D9EA;
  --cobalt:#2B37FF; --coral:#FF4B36; --sun:#FFD233; --white:#FFFFFF;
  --display:"Karantina","Arial Narrow",sans-serif;
  --body:"Assistant",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
.banner{width:1920px;height:640px;background:var(--bg);color:var(--ink);font-family:var(--body);position:relative;overflow:hidden;display:grid;grid-template-rows:1fr 96px}
.main{display:grid;grid-template-columns:1fr auto;align-items:center;gap:64px;padding:0 90px}
.eyebrow{font-weight:800;font-size:30px;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--display);font-weight:700;font-size:224px;line-height:.82;margin:0;white-space:nowrap;letter-spacing:.01em}
h1 .era{color:var(--coral)}
h1 .ai{display:inline-block;background:var(--cobalt);color:var(--white);padding:.07em .13em 0;direction:ltr;transform:rotate(-3deg);margin-inline-start:.04em}
h1 .ai::after{content:"";display:inline-block;width:.06em;height:.62em;background:var(--sun);margin-inline-start:.05em;vertical-align:-.02em}
.dept{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 40px;background:var(--white);border:4px solid var(--ink);box-shadow:-18px 18px 0 var(--cobalt);width:460px;text-align:center;flex:none}
.logo{height:170px;max-width:100%;display:flex;align-items:center;justify-content:center}
.logo img{max-height:170px;max-width:440px;object-fit:contain}
.logo .ph{width:170px;height:170px;border:3px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--muted);line-height:1.2}
.dept p{margin:0;font-weight:800;font-size:34px;line-height:1.2}
.dept small{display:block;font-weight:600;font-size:24px;color:var(--muted);margin-top:6px}
.strip{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:40px;padding:0 60px;direction:ltr;justify-content:center;white-space:nowrap;overflow:hidden}
.strip span{font-family:var(--display);font-size:52px;line-height:1;padding-top:8px;display:flex;align-items:center;gap:40px}
.strip span::after{content:"✦";color:var(--sun);font-size:30px}
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="main">
    <div>
      <p class="eyebrow">אוניברסיטת בר-אילן</p>
      <h1>שיווק <span class="era">בעידן ה־</span><span class="ai">AI</span></h1>
    </div>
    <div class="dept">
      <div class="logo" id="logoBox">
        <img src="dept-logo.png" alt="לוגו המחלקה למדעי המידע ויישומי בינה מלאכותית"
             onerror="this.parentNode.innerHTML='&lt;div class=&quot;ph&quot;&gt;כאן ייכנס&lt;br&gt;לוגו המחלקה&lt;/div&gt;'">
      </div>
      <p>המחלקה למדעי המידע<br>ויישומי בינה מלאכותית</p>
    </div>
  </div>
  <div class="strip" aria-hidden="true">
    <span>Persona</span><span>CTR</span><span>Growth Hacking</span><span>Prompt</span><span>Disruption</span><span>Brand Love</span><span>A/B Test</span>
  </div>
</div>
</body>
</html>
