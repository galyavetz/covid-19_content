<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>באנר מנהיגות וממשל בעידן ה-AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@600;800&display=swap">
<style>
/* Banner 1920x640: title on the right, a sticker-bomb of leaders + robots on the left, logo in the bottom strip. */
:root{
  --bg:#F2F3FA; --ink:#0D0E2B; --muted:#5A5D7D; --dot:#D3D6EC;
  --cobalt:#2B37FF; --coral:#FF4B36; --sun:#FFD233; --mint:#2DD4A0; --pink:#FF5CB3; --white:#FFFFFF;
  --display:"Karantina","Arial Narrow",sans-serif;
  --body:"Assistant",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
.banner{width:1920px;height:640px;color:var(--ink);font-family:var(--body);position:relative;overflow:hidden;display:grid;grid-template-rows:1fr 110px;
  background:var(--bg) radial-gradient(var(--dot) 2.2px,transparent 2.6px) 0 0/28px 28px}
.main{position:relative}
.title{position:absolute;right:90px;top:50%;transform:translateY(-50%)}
.eyebrow{font-weight:800;font-size:30px;letter-spacing:.04em;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:700;font-size:172px;line-height:.9;margin:0;white-space:nowrap;letter-spacing:.01em}
h1 .era{color:var(--coral)}
h1 .l2{display:block;margin-top:.04em}
h1 .ai{display:inline-block;background:var(--cobalt);color:var(--white);padding:.07em .13em 0;direction:ltr;transform:rotate(-3deg);margin-inline-start:.04em}
h1 .ai::after{content:"";display:inline-block;width:.06em;height:.62em;background:var(--sun);margin-inline-start:.05em;vertical-align:-.02em}

/* stickers */
.stk{position:absolute;filter:drop-shadow(-7px 7px 0 var(--ink))}
.stk svg{display:block}
.tagname{position:absolute;font-family:var(--display);font-size:38px;line-height:1;padding:8px 16px 2px;background:var(--ink);color:var(--white);border:3px solid var(--white);white-space:nowrap}
.bubble{position:absolute;background:var(--white);border:4px solid var(--ink);border-radius:28px;padding:10px 20px 6px;font-family:var(--display);font-size:40px;line-height:1;white-space:nowrap;box-shadow:-6px 6px 0 var(--ink)}
.bubble::after{content:"";position:absolute;width:22px;height:22px;background:var(--white);border:4px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}
.b-down::after{bottom:-15px;right:40px}
.b-up::after{top:-15px;left:40px;transform:rotate(-135deg)}
.b-left::after{left:-15px;top:22px;transform:rotate(135deg)}
.spark{position:absolute;font-size:46px;line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink)}
.chip{position:absolute;font-family:var(--body);font-weight:800;font-size:24px;padding:6px 16px;border:3px solid var(--ink);border-radius:99px;background:var(--mint);color:var(--ink);direction:ltr}

.strip{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:36px;padding:0 50px;direction:ltr;white-space:nowrap;overflow:hidden}
.strip img{height:84px;width:auto;flex:none;margin-right:12px}
.strip .sep{width:3px;height:60px;background:var(--muted);flex:none}
.strip span{font-family:var(--display);font-size:50px;line-height:1;padding-top:8px;display:flex;align-items:center;gap:36px}
.strip span::after{content:"✦";color:var(--sun);font-size:28px}
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="main">

    <!-- Herzl -->
    <div class="stk" style="left:70px;top:46px;transform:rotate(-8deg)">
      <svg width="230" height="230" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="97" fill="#fff"/>
        <circle cx="100" cy="100" r="88" fill="#FFD233" stroke="#0D0E2B" stroke-width="5"/>
        <clipPath id="c1"><circle cx="100" cy="100" r="86"/></clipPath>
        <g clip-path="url(#c1)">
          <path d="M28 205 Q36 152 100 146 Q164 152 172 205Z" fill="#0D0E2B"/>
          <path d="M84 150 L100 180 L116 150Z" fill="#fff"/>
          <rect x="88" y="120" width="24" height="30" fill="#F2C29A"/>
          <ellipse cx="60" cy="88" rx="8" ry="12" fill="#F2C29A" stroke="#0D0E2B" stroke-width="3"/><ellipse cx="140" cy="88" rx="8" ry="12" fill="#F2C29A" stroke="#0D0E2B" stroke-width="3"/>
          <ellipse cx="100" cy="86" rx="40" ry="44" fill="#F2C29A" stroke="#0D0E2B" stroke-width="3"/>
          <path d="M62 70 Q58 30 100 32 Q142 30 138 70 Q130 50 112 52 Q104 44 96 52 Q74 48 62 70Z" fill="#1B1B1F"/>
          <path d="M70 104 Q66 152 100 180 Q134 152 130 104 Q122 122 100 124 Q78 122 70 104Z" fill="#1B1B1F" stroke="#0D0E2B" stroke-width="2"/>
          <path d="M80 104 Q100 96 120 104 Q100 110 80 104Z" fill="#1B1B1F"/>
          <path d="M76 74 L92 71" stroke="#1B1B1F" stroke-width="5" stroke-linecap="round"/>
          <path d="M108 71 L124 74" stroke="#1B1B1F" stroke-width="5" stroke-linecap="round"/>
          <circle cx="85" cy="82" r="4" fill="#0D0E2B"/><circle cx="115" cy="82" r="4" fill="#0D0E2B"/>
          <path d="M100 84 Q96 96 101 98" stroke="#0D0E2B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="tagname" style="left:110px;top:262px;transform:rotate(-6deg)">הרצל</div>
    <div class="bubble b-up" style="left:40px;top:340px;transform:rotate(-3deg)">אם תפרמפטו, אין זו אגדה</div>

    <!-- Robot leader with crown -->
    <div class="stk" style="left:360px;top:120px;transform:rotate(5deg)">
      <svg width="270" height="290" viewBox="0 0 200 215">
        <path d="M58 52 L70 18 L86 40 L100 10 L114 40 L130 18 L142 52Z" fill="#FFD233" stroke="#0D0E2B" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="100" cy="10" r="7" fill="#FF5CB3" stroke="#0D0E2B" stroke-width="4"/>
        <rect x="36" y="52" width="128" height="104" rx="26" fill="#2B37FF" stroke="#0D0E2B" stroke-width="6"/>
        <rect x="24" y="86" width="16" height="36" rx="6" fill="#FF4B36" stroke="#0D0E2B" stroke-width="5"/>
        <rect x="160" y="86" width="16" height="36" rx="6" fill="#FF4B36" stroke="#0D0E2B" stroke-width="5"/>
        <rect x="52" y="70" width="96" height="54" rx="16" fill="#0D0E2B"/>
        <rect x="68" y="84" width="20" height="24" rx="6" fill="#2DD4A0"/>
        <rect x="112" y="84" width="20" height="24" rx="6" fill="#2DD4A0"/>
        <path d="M78 136 Q100 148 122 136" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="56" y="158" width="88" height="56" rx="14" fill="#fff" stroke="#0D0E2B" stroke-width="6"/>
        <path d="M92 158 L108 158 L104 172 L112 206 L100 214 L88 206 L96 172Z" fill="#FF4B36" stroke="#0D0E2B" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bubble b-down" style="left:400px;top:30px;transform:rotate(-4deg)">תצביעו לי?</div>
    <div class="chip" style="left:415px;top:430px;transform:rotate(-5deg);background:var(--sun)">PM_v2.0</div>

    <!-- Trump -->
    <div class="stk" style="left:640px;top:40px;transform:rotate(9deg)">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="97" fill="#fff"/>
        <circle cx="100" cy="100" r="88" fill="#FF5CB3" stroke="#0D0E2B" stroke-width="5"/>
        <clipPath id="c2"><circle cx="100" cy="100" r="86"/></clipPath>
        <g clip-path="url(#c2)">
          <path d="M22 205 Q30 150 100 144 Q170 150 178 205Z" fill="#1E2A6B"/>
          <path d="M80 146 L100 200 L120 146Z" fill="#fff"/>
          <path d="M94 150 L106 150 L110 196 L100 206 L90 196Z" fill="#E3242B" stroke="#0D0E2B" stroke-width="2"/>
          <rect x="86" y="118" width="28" height="30" fill="#F4A261"/>
          <ellipse cx="100" cy="92" rx="40" ry="44" fill="#F4A261" stroke="#0D0E2B" stroke-width="3"/>
          <path d="M56 86 Q50 40 100 38 Q150 36 150 70 Q146 60 130 58 Q140 72 120 66 Q96 58 76 66 Q66 72 62 92Z" fill="#FFD54A" stroke="#0D0E2B" stroke-width="3" stroke-linejoin="round"/>
          <path d="M78 82 Q86 78 94 82" stroke="#0D0E2B" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M106 82 Q114 78 122 82" stroke="#0D0E2B" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse cx="86" cy="86" rx="8" ry="5" fill="#fff"/><ellipse cx="114" cy="86" rx="8" ry="5" fill="#fff"/>
          <circle cx="86" cy="86" r="3" fill="#0D0E2B"/><circle cx="114" cy="86" r="3" fill="#0D0E2B"/>
          <ellipse cx="100" cy="114" rx="8" ry="6" fill="#B5473A" stroke="#0D0E2B" stroke-width="2.5"/>
        </g>
      </svg>
    </div>
    <div class="tagname" style="left:665px;top:236px;transform:rotate(5deg)">POTUS.exe</div>

    <!-- Ben-Gurion -->
    <div class="stk" style="left:655px;top:288px;transform:rotate(-7deg)">
      <svg width="190" height="190" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="97" fill="#fff"/>
        <circle cx="100" cy="100" r="88" fill="#2DD4A0" stroke="#0D0E2B" stroke-width="5"/>
        <clipPath id="c3"><circle cx="100" cy="100" r="86"/></clipPath>
        <g clip-path="url(#c3)">
          <path d="M26 205 Q34 150 100 146 Q166 150 174 205Z" fill="#C9B27A"/>
          <path d="M80 146 L100 172 L120 146Z" fill="#F2C29A"/>
          <rect x="88" y="120" width="24" height="30" fill="#F2C29A"/>
          <ellipse cx="100" cy="94" rx="38" ry="42" fill="#F2C29A" stroke="#0D0E2B" stroke-width="3"/>
          <g fill="#fff" stroke="#0D0E2B" stroke-width="3">
            <circle cx="56" cy="78" r="16"/><circle cx="48" cy="98" r="14"/><circle cx="62" cy="60" r="12"/>
            <circle cx="144" cy="78" r="16"/><circle cx="152" cy="98" r="14"/><circle cx="138" cy="60" r="12"/>
          </g>
          <path d="M76 82 L94 80" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
          <path d="M106 80 L124 82" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
          <circle cx="86" cy="92" r="4" fill="#0D0E2B"/><circle cx="114" cy="92" r="4" fill="#0D0E2B"/>
          <path d="M86 116 Q100 112 114 116" stroke="#0D0E2B" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="tagname" style="left:680px;top:462px;transform:rotate(-4deg)">בן-גוריון</div>

    <!-- small robot -->
    <div class="stk" style="left:200px;top:440px;transform:rotate(-12deg)">
      <svg width="120" height="90" viewBox="0 0 120 90">
        <line x1="60" y1="4" x2="60" y2="20" stroke="#0D0E2B" stroke-width="5"/>
        <circle cx="60" cy="6" r="6" fill="#FFD233" stroke="#0D0E2B" stroke-width="4"/>
        <rect x="10" y="20" width="100" height="66" rx="18" fill="#FF4B36" stroke="#0D0E2B" stroke-width="5"/>
        <circle cx="40" cy="50" r="10" fill="#fff" stroke="#0D0E2B" stroke-width="4"/>
        <circle cx="80" cy="50" r="10" fill="#fff" stroke="#0D0E2B" stroke-width="4"/>
        <circle cx="42" cy="52" r="4" fill="#0D0E2B"/><circle cx="82" cy="52" r="4" fill="#0D0E2B"/>
        <path d="M46 72 L74 72" stroke="#0D0E2B" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="chip" style="left:30px;top:480px;transform:rotate(6deg);background:var(--pink)">no cap</div>

    <span class="spark" style="left:320px;top:40px">✦</span>
    <span class="spark" style="left:610px;top:270px;font-size:34px">✦</span>
    <span class="spark" style="left:870px;top:200px">✦</span>
    <span class="spark" style="left:575px;top:470px;font-size:34px">✦</span>

    <div class="title">
      <p class="eyebrow">קורס</p>
      <h1>מנהיגות <span class="era">וממשל</span><span class="l2"><span class="era">בעידן ה־</span><span class="ai">AI</span></span></h1>
    </div>
  </div>
  <div class="strip">
    <img src="dept-logo.png" alt="המחלקה למדעי המידע ויישומי בינה מלאכותית, הפקולטה למדעי הרוח, אוניברסיטת בר-אילן">
    <i class="sep"></i>
    <span>Leadership</span><span>Policy</span><span>Democracy</span><span>Algorithms</span><span>Ethics</span><span>Regulation</span>
  </div>
</div>
</body>
</html>
